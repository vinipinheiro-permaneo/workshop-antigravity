name: ci
on: [pull_request]
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4          # 🔴: troque pelo SHA do release
      - run: python ferramentas/validar.py
# deploy saiu do CI de PR: passa pela esteira (teste → homologação → aprovação humana)
